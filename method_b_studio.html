<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>开放词汇SAM2基础分割｜对照技术</title>
<script>if(location.protocol==="file:")location.replace("http://127.0.0.1:8765/method_b_studio.html"+location.search+location.hash)</script>
<style>
:root{color-scheme:dark;--bg:#071018;--panel:#101c29;--line:#294055;--text:#edf5fb;--muted:#91a5b7;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{border:1px solid var(--accent);background:var(--accent);color:#06111d;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:800}button:disabled{opacity:.45}header{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:18px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#071018f2;z-index:5}h1,h2{margin:0 0 7px}.hint,.status,.meta,p{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{padding:9px 12px;border:1px solid var(--line);border-radius:9px}nav a.active{background:var(--accent);color:#06111d;font-weight:800}main{width:min(1480px,calc(100% - 32px));margin:18px auto 48px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.intro{display:grid;grid-template-columns:1.4fr 1fr;gap:15px;margin-bottom:16px}.flow{font-weight:750;color:#d8e9f8}.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}.sidebar{max-height:920px;overflow:auto}.category{margin:16px 0 7px;color:#93c5fd;font-weight:800;border-bottom:1px solid var(--line);padding-bottom:5px}.case{padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer}.case.selected{border-color:var(--accent);background:#152b42}.case small{color:var(--muted)}.gt{float:right;color:#7cecdf;font-size:11px}.source{width:100%;max-height:620px;object-fit:contain;background:#05080c;border:1px solid var(--line);border-radius:10px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.output{display:grid;grid-template-columns:1fr 1fr;gap:12px}.output img{width:100%;min-height:250px;max-height:580px;object-fit:contain;background:#05080c;border:1px solid var(--line);border-radius:9px}.meta{white-space:pre-wrap;word-break:break-all}.upload{display:block;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}@media(max-width:960px){.intro,.workspace,.output{grid-template-columns:1fr}.sidebar{max-height:none}}
</style></head><body>
<header><div><h1>开放词汇SAM2基础分割</h1><div class="hint">智能对照技术｜零训练｜零点击｜零人工笔刷</div></div><nav><a href="ground_truth_studio.html">人工真值</a><a class="active" href="method_b_studio.html">开放词汇SAM2</a><a href="method_c_studio.html">障碍感知拓扑反馈</a><a href="lattice_studio.html">成果应用</a></nav></header>
<main><section class="intro"><article class="panel"><h2>固定流程</h2><div class="flow">固定英文概念词组 → Grounding DINO自动定位 → SAM2.1原始Mask</div><p>本页不让操作者画框或点选，也不做植物/石头排除、杆件过滤、断点连接或拓扑修复，因此可作为通用智能分割对照。</p><span id="runtime" class="status">检查模型……</span></article><article class="panel"><h2>论文边界</h2><p>它回答“通用开放词汇模型能否直接识别窗棂”。模型内部置信度不是人工真值IoU；真实精度需等人工Mask复核后统一计算。</p></article></section>
<section class="workspace"><aside class="panel sidebar"><b>30张冻结测试集</b><div id="progress" class="status">加载中……</div><div id="caseList"></div><label class="upload"><b>或上传自定义图片</b><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp"></label></aside>
<section class="panel"><h2 id="caseTitle">请选择案例</h2><img id="source" class="source" alt="原图"><canvas id="raw" hidden></canvas><div class="actions"><button id="run" disabled>运行开放词汇SAM2</button><span id="message" class="status">等待图片。</span></div><div class="output"><img id="mask" alt="基础Mask"><img id="overlay" alt="基础叠加效果"></div><pre id="meta" class="meta">尚未运行。</pre></section></section></main>
<script>
const $=id=>document.getElementById(id),raw=$('raw'),rawCtx=raw.getContext('2d');let currentCase='',image=null;
function msg(t){$('message').textContent=t}function load(src,name,id){const im=new Image();im.onload=()=>{image=im;const s=Math.min(1,1300/Math.max(im.naturalWidth,im.naturalHeight));raw.width=Math.round(im.naturalWidth*s);raw.height=Math.round(im.naturalHeight*s);rawCtx.clearRect(0,0,raw.width,raw.height);rawCtx.drawImage(im,0,0,raw.width,raw.height);$('source').src=raw.toDataURL('image/png');currentCase=id;$('caseTitle').textContent=name;$('run').disabled=false;$('mask').removeAttribute('src');$('overlay').removeAttribute('src');$('meta').textContent='尚未运行。';msg('图片已加载。定位框和Mask将全自动产生。')};im.src=src}
async function loadCases(){const r=await fetch('/api/lattice-dataset/cases'),d=await r.json();if(!r.ok)throw new Error(d.error);$('progress').textContent=`共${d.count}张｜${d.ground_truth_count}张真值子集`;$('caseList').innerHTML='';let cat='';d.cases.forEach(item=>{if(item.category!==cat){cat=item.category;const h=document.createElement('div');h.className='category';h.textContent=cat;$('caseList').appendChild(h)}const el=document.createElement('div');el.className='case';el.innerHTML=`${item.case_id}${item.ground_truth_selected?'<span class="gt">真值子集</span>':''}<br><small>${item.filename}</small>`;el.onclick=()=>{document.querySelectorAll('.case').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');load(`/api/lattice-dataset/cases/${item.case_id}/source?t=${Date.now()}`,`${item.category}｜${item.filename}`,item.case_id)};$('caseList').appendChild(el)});document.querySelector('.case')?.click()}
async function runtime(){const r=await fetch('/api/segmentation-methods/status'),d=await r.json();$('runtime').textContent=d.sam_ready?`已就绪｜${d.model_type}｜无需训练`:`未就绪｜${d.error||'请从启动器重新进入'}`}
async function run(){if(!image)return;$('run').disabled=true;msg('正在自动定位并分割，首次运行会加载模型……');try{const r=await fetch('/api/segmentation-methods/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:'sam_b',case_id:currentCase,image:raw.toDataURL('image/png'),prompt:{}})}),d=await r.json();if(!r.ok)throw new Error(d.error);$('mask').src=d.mask;$('overlay').src=d.overlay;const s=d.metadata.selected_detection||{},q=d.metadata.sam2||{};$('meta').textContent=`技术版本：${d.metadata.algorithm_version}\n自动定位：${s.label||'回退区域'}｜置信度 ${s.score??'-'}\n自动框：[${(s.box||[]).join(', ')}]\nSAM2内部预测IoU：${q.predicted_iou??'-'}\n前景覆盖率：${(d.metadata.foreground_coverage*100).toFixed(2)}%\n耗时：${d.metadata.duration_seconds}s\n保存位置：${d.output_dir}`;msg('完成。该结果未经过任何窗棂专用修复。')}catch(e){msg(`运行失败：${e.message}`)}finally{$('run').disabled=false}}
$('run').onclick=run;$('fileInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>load(rd.result,f.name,f.name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9_-]+/g,'_'));rd.readAsDataURL(f)};Promise.all([loadCases(),runtime()]).catch(e=>msg(e.message));
</script></body></html>
