<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>窗棂人工真值标注台</title>
  <script>
    if(location.protocol==="file:") location.replace("http://127.0.0.1:8765/ground_truth_studio.html"+location.search+location.hash);
  </script>
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:#101c29;--line:#294055;--text:#e8f0f7;--muted:#91a5b7;--accent:#2dd4bf;--warn:#fb923c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#071018ee;z-index:5}h1{font-size:22px;margin:0}button,select,input{font:inherit}button,select,input[type=text]{background:#0a1520;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 13px}button{cursor:pointer}button.primary{background:var(--accent);color:#04120f;border-color:var(--accent);font-weight:700}button.active{outline:2px solid var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;padding:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.sidebar{position:sticky;top:92px;height:calc(100vh - 112px);overflow:auto}.folder-drop{display:block;border:2px dashed #3c6678;border-radius:14px;padding:22px 14px;margin:12px 0;text-align:center;background:#0a1722;cursor:pointer;transition:.18s}.folder-drop.dragging{border-color:var(--accent);background:#12302f;transform:translateY(-1px)}.folder-icon{display:block;font-size:34px;margin-bottom:5px}.folder-drop input{display:none}.category-title{margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line);color:#7cecdf;font-weight:800}.case{display:flex;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer}.case:hover{border-color:#4c7388}.case.selected{border-color:var(--accent);background:#12302f}.empty-folder{padding:18px 10px;border:1px solid var(--line);border-radius:10px;text-align:center;color:var(--muted)}.status{color:var(--muted);font-size:13px}.warning{padding:12px;border-radius:10px;background:#3a2515;color:#fed7aa;margin:12px 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.canvases{display:grid;grid-template-columns:1fr 1fr;gap:16px}.canvas-card{background:#060b10;border:1px solid var(--line);border-radius:14px;padding:12px}.canvas-card h3{margin:0 0 10px}canvas{width:100%;height:auto;background:#000;display:block;border-radius:8px;touch-action:none}.hint{color:var(--muted)}.direct3d{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:16px;padding:15px;border:1px solid #236f65;background:#0d302d;border-radius:12px}.direct3d b{display:block;color:#d9fff8}.direct3d p{margin:3px 0 0;color:#9bc8c1;font-size:13px}@media(max-width:900px){main{grid-template-columns:1fr}.sidebar{position:static;height:auto}.canvases{grid-template-columns:1fr}.direct3d{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header><div><h1>窗棂人工真值标注台</h1><div class="status">从空白Mask独立描绘 · 不受任何自动分割结果影响</div></div><div><a href="method_b_studio.html"><button>SAM基础分割</button></a> <a href="method_c_studio.html"><button>ECO-Lattice研究台</button></a> <a href="lattice_studio.html"><button>成果应用与三维重建</button></a></div></header>
<main>
  <aside class="panel sidebar"><b>我的人工标注文件夹</b><div class="status">拖入任意窗棂图片，上传完成后点击文件名即可开始编辑。</div><label id="dropZone" class="folder-drop" tabindex="0"><span class="folder-icon">📁</span><b>把图片拖到这里</b><br><span class="status">或点击选择多张 PNG、JPG、WebP</span><input id="folderInput" type="file" multiple accept="image/png,image/jpeg,image/webp"></label><div id="progress" class="status">正在读取文件夹……</div><div id="caseList"></div></aside>
  <section class="panel">
    <div id="caseTitle"><h2>请选择案例</h2></div>
    <div class="warning">只描绘照片中可见的窗框与窗棂实体。植物、假山、石头、墙面和阴影必须保持黑色；被遮挡部分不得主观补全。</div>
    <div class="toolbar">
      <button id="paint" class="active">补成实体</button><button id="erase">擦成背景</button>
      <button id="freehand" class="active">防抖连续描线</button><button id="polyline">点选折线</button><button id="undo">撤销上一笔</button>
      <button id="wandPaint">连通区域填充</button><button id="wandErase">连通区域擦除</button>
      <label>取样容差 <input id="wandTolerance" type="range" min="5" max="90" value="34"> <b id="wandText">34</b></label>
      <label>笔刷 <input id="brush" type="range" min="2" max="60" value="16"> <b id="brushText">16</b></label>
      <label>叠加透明度 <input id="alpha" type="range" min="0" max="90" value="48"></label>
      <button id="clear">清空Mask</button><button id="save">保存草稿</button><button id="submit" class="primary">标注完成，提交复核</button>
      <input id="annotator" type="text" placeholder="标注人姓名">
    </div>
    <div id="message" class="status">标注不会自动变成正式真值，仍需第二位复核者检查并签名。</div>
    <div class="canvases"><div class="canvas-card"><h3>原始工作图</h3><canvas id="source"></canvas></div><div class="canvas-card"><h3>人工Mask叠加</h3><canvas id="editor"></canvas><p class="hint">白色区域表示窗棂实体；编辑画布显示为青色叠加。</p></div></div>
    <div class="direct3d"><div><b>人工真值 → 2.5D模型</b><p>使用当前人工Mask进入三维重建平台；后续建模修正不会回写人工真值。</p></div><button id="to3d" class="primary" disabled>生成3D模型</button></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id),source=$('source'),editor=$('editor'),sctx=source.getContext('2d'),ectx=editor.getContext('2d');
let cases=[],current=null,image=null,mask=document.createElement('canvas'),mctx=mask.getContext('2d',{willReadFrequently:true}),tool='paint',drawMode='freehand',drawing=false,last=null,polyAnchor=null,history=[];
async function loadCases(){const r=await fetch('/api/ground-truth/cases'),data=await r.json();if(!r.ok)throw new Error(data.error);cases=data.cases;renderList()}
function renderList(){const done=cases.filter(c=>c.has_saved_mask).length,approved=cases.filter(c=>c.ground_truth_approved).length;$('progress').textContent=cases.length?`文件夹共 ${cases.length} 张｜已保存 ${done} 张｜已复核 ${approved} 张`:'文件夹为空：请拖入图片。';$('caseList').innerHTML='';if(!cases.length){$('caseList').innerHTML='<div class="empty-folder">尚无图片<br><small>拖入后会保存在本机实验文件夹中</small></div>';return}const title=document.createElement('div');title.className='category-title';title.textContent='已导入图片';$('caseList').appendChild(title);for(const item of cases){const div=document.createElement('div');div.className='case'+(current?.case_id===item.case_id?' selected':'');div.innerHTML=`<span><b>${item.filename}</b><br><small>${item.case_id}</small></span><span class="status">${item.ground_truth_approved?'已复核':item.has_saved_mask?'已保存':'待标注'}</span>`;div.onclick=()=>selectCase(item.case_id);$('caseList').appendChild(div)}}
async function selectCase(id){current=cases.find(c=>c.case_id===id);if(!current)return;history=[];polyAnchor=null;$('caseTitle').innerHTML=`<h2>${current.filename}</h2><div class="status">${current.case_id}</div>`;image=new Image();image.src=`/api/ground-truth/cases/${id}/source?t=${Date.now()}`;await image.decode();source.width=editor.width=mask.width=image.naturalWidth;source.height=editor.height=mask.height=image.naturalHeight;sctx.clearRect(0,0,source.width,source.height);sctx.drawImage(image,0,0);mctx.fillStyle='black';mctx.fillRect(0,0,mask.width,mask.height);if(current.has_saved_mask){const maskImage=new Image();maskImage.src=`/api/ground-truth/cases/${id}/mask?t=${Date.now()}`;await maskImage.decode();mctx.drawImage(maskImage,0,0,mask.width,mask.height)}normalizeMask();drawEditor();renderList();$('to3d').disabled=false;$('message').textContent=`已加载 ${image.naturalWidth}×${image.naturalHeight}px。防抖模式适合曲线；点选折线适合规则格栅。`}
function normalizeMask(){const d=mctx.getImageData(0,0,mask.width,mask.height);for(let i=0;i<d.data.length;i+=4){const v=(d.data[i]+d.data[i+1]+d.data[i+2])/3>127?255:0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}mctx.putImageData(d,0,0)}
function drawEditor(){if(!image)return;ectx.clearRect(0,0,editor.width,editor.height);ectx.drawImage(image,0,0);const d=mctx.getImageData(0,0,mask.width,mask.height),overlay=ectx.getImageData(0,0,editor.width,editor.height),a=Number($('alpha').value)/100;for(let i=0;i<d.data.length;i+=4)if(d.data[i]>127){overlay.data[i]=Math.round(overlay.data[i]*(1-a));overlay.data[i+1]=Math.round(overlay.data[i+1]*(1-a)+212*a);overlay.data[i+2]=Math.round(overlay.data[i+2]*(1-a)+191*a)}ectx.putImageData(overlay,0,0)}
function point(ev){const r=editor.getBoundingClientRect();return{x:(ev.clientX-r.left)*editor.width/r.width,y:(ev.clientY-r.top)*editor.height/r.height}}
function remember(){history.push(mctx.getImageData(0,0,mask.width,mask.height));if(history.length>40)history.shift()}
function stroke(a,b){mctx.save();mctx.strokeStyle=tool==='paint'?'white':'black';mctx.lineWidth=Number($('brush').value);mctx.lineCap='round';mctx.lineJoin='round';mctx.beginPath();mctx.moveTo(a.x,a.y);mctx.lineTo(b.x,b.y);mctx.stroke();mctx.restore();drawEditor()}
function floodFill(p,paintValue){
  const w=mask.width,h=mask.height,x0=Math.max(0,Math.min(w-1,Math.round(p.x))),y0=Math.max(0,Math.min(h-1,Math.round(p.y))),tol=Number($('wandTolerance').value);
  const src=sctx.getImageData(0,0,w,h),dst=mctx.getImageData(0,0,w,h),seed=(y0*w+x0)*4,sr=src.data[seed],sg=src.data[seed+1],sb=src.data[seed+2];
  const visited=new Uint8Array(w*h),qx=new Int32Array(w*h),qy=new Int32Array(w*h);let head=0,tail=0;qx[tail]=x0;qy[tail++]=y0;visited[y0*w+x0]=1;
  while(head<tail){const x=qx[head],y=qy[head++],idx=y*w+x,i=idx*4,dr=src.data[i]-sr,dg=src.data[i+1]-sg,db=src.data[i+2]-sb;if(Math.sqrt(dr*dr+dg*dg+db*db)>tol*2.35)continue;dst.data[i]=dst.data[i+1]=dst.data[i+2]=paintValue;dst.data[i+3]=255;const push=(nx,ny)=>{const ni=ny*w+nx;if(!visited[ni]){visited[ni]=1;qx[tail]=nx;qy[tail++]=ny}};if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);if(y>0)push(x,y-1);if(y<h-1)push(x,y+1)}
  mctx.putImageData(dst,0,0);drawEditor();
}
editor.onpointerdown=e=>{const p=point(e);if(drawMode==='wandPaint'||drawMode==='wandErase'){remember();floodFill(p,drawMode==='wandPaint'?255:0);$('message').textContent=drawMode==='wandPaint'?'已填充相邻同色实体；请检查是否越界。':'已擦除相邻同色背景。';return}if(drawMode==='polyline'){if(!polyAnchor){remember();polyAnchor=p;stroke(p,p);$('message').textContent='折线起点已设定；继续点击添加线段，双击结束。'}else{stroke(polyAnchor,p);polyAnchor=p}return}remember();drawing=true;last=p;editor.setPointerCapture(e.pointerId);stroke(last,last)};
editor.onpointermove=e=>{if(!drawing||drawMode!=='freehand')return;const raw=point(e),p={x:last.x*.58+raw.x*.42,y:last.y*.58+raw.y*.42};stroke(last,p);last=p};
editor.onpointerup=()=>drawing=false;editor.onpointercancel=()=>drawing=false;editor.ondblclick=()=>{if(drawMode==='polyline'){polyAnchor=null;$('message').textContent='折线已结束。'}};
$('paint').onclick=()=>{tool='paint';$('paint').classList.add('active');$('erase').classList.remove('active')};$('erase').onclick=()=>{tool='erase';$('erase').classList.add('active');$('paint').classList.remove('active')};$('brush').oninput=e=>$('brushText').textContent=e.target.value;$('alpha').oninput=drawEditor;$('clear').onclick=()=>{if(!current)return;mctx.fillStyle='black';mctx.fillRect(0,0,mask.width,mask.height);drawEditor()};
$('freehand').onclick=()=>{drawMode='freehand';polyAnchor=null;for(const id of ['polyline','wandPaint','wandErase'])$(id).classList.remove('active');$('freehand').classList.add('active');$('message').textContent='防抖连续描线已启用：拖动时会自动平滑手部抖动。'};
$('polyline').onclick=()=>{drawMode='polyline';polyAnchor=null;for(const id of ['freehand','wandPaint','wandErase'])$(id).classList.remove('active');$('polyline').classList.add('active');$('message').textContent='点选折线已启用：依次点击节点，双击结束当前折线。'};
$('wandPaint').onclick=()=>{drawMode='wandPaint';polyAnchor=null;for(const id of ['freehand','polyline','wandErase'])$(id).classList.remove('active');$('wandPaint').classList.add('active');$('message').textContent='连通区域填充：点击实体内部，只填充颜色相近且连续的区域。'};
$('wandErase').onclick=()=>{drawMode='wandErase';polyAnchor=null;for(const id of ['freehand','polyline','wandPaint'])$(id).classList.remove('active');$('wandErase').classList.add('active');$('message').textContent='连通区域擦除：点击误选背景，移除颜色相近且连续的区域。'};
$('wandTolerance').oninput=e=>$('wandText').textContent=e.target.value;
$('undo').onclick=()=>{const previous=history.pop();if(!previous)return;polyAnchor=null;mctx.putImageData(previous,0,0);drawEditor();$('message').textContent='已撤销上一笔。'};
async function save(submit){if(!current)return;const payload={mask:mask.toDataURL('image/png'),annotator:$('annotator').value,submit_for_review:submit};$('message').textContent='正在保存……';const r=await fetch(`/api/ground-truth/cases/${current.case_id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.error);current.has_saved_mask=true;current.status=data.status;renderList();$('message').textContent=submit?'已提交第二人复核；尚未成为正式真值。':'草稿已保存。'}
function fileData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error(`${file.name} 读取失败`));reader.readAsDataURL(file)})}
function imageSize(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve({width:im.naturalWidth,height:im.naturalHeight});im.onerror=()=>reject(new Error('无法解析图片尺寸'));im.src=src})}
async function importFiles(fileList){const files=[...fileList].filter(file=>['image/png','image/jpeg','image/webp'].includes(file.type));if(!files.length){$('progress').textContent='没有可导入的PNG、JPG或WebP图片。';return}let newest=null;for(let i=0;i<files.length;i++){const file=files[i];$('progress').textContent=`正在导入 ${i+1}/${files.length}：${file.name}`;const imageData=await fileData(file),size=await imageSize(imageData),r=await fetch('/api/ground-truth/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,image:imageData,width:size.width,height:size.height})}),data=await r.json();if(!r.ok)throw new Error(data.error||`${file.name} 导入失败`);newest=data.case_id}await loadCases();if(newest)await selectCase(newest);$('progress').textContent=`已导入 ${files.length} 张；点击左侧任意图片可切换编辑。`}
async function to3d(){if(!current||!image)return;$('to3d').disabled=true;$('message').textContent='正在把当前人工Mask送入三维重建平台……';try{const r=await fetch('/api/csam-handoffs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ready_for_3d:true,case_id:current.case_id,source:source.toDataURL('image/png'),mask:mask.toDataURL('image/png'),method_label:'人工真值Mask',stage:'GT',handoff_kind:'manual_ground_truth',analysis_method:'manual_ground_truth_mask',algorithm_version:'manual_annotation',validation_note:'人工Mask直接用于2.5D建模终检，不改变人工真值记录。'})}),data=await r.json();if(!r.ok)throw new Error(data.error||'三维交接失败');location.href=data.application_url}catch(e){$('message').textContent=e.message;$('to3d').disabled=false}}
const dropZone=$('dropZone');for(const eventName of ['dragenter','dragover'])dropZone.addEventListener(eventName,event=>{event.preventDefault();dropZone.classList.add('dragging')});for(const eventName of ['dragleave','drop'])dropZone.addEventListener(eventName,event=>{event.preventDefault();dropZone.classList.remove('dragging')});dropZone.addEventListener('drop',event=>importFiles(event.dataTransfer.files).catch(e=>$('progress').textContent=e.message));dropZone.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();$('folderInput').click()}});$('folderInput').onchange=event=>{importFiles(event.target.files).catch(e=>$('progress').textContent=e.message);event.target.value=''};
$('save').onclick=()=>save(false).catch(e=>$('message').textContent=e.message);$('submit').onclick=()=>save(true).catch(e=>$('message').textContent=e.message);$('to3d').onclick=to3d;loadCases().catch(e=>$('message').textContent=e.message);
</script>
</body></html>
