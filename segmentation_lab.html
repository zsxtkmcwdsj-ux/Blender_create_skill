<body><header><b>传统窗棂分割实验</b></header><main><h1>基线与论文提出方法独立运行</h1><div class="cards"><section class="card"><h2>开放词汇 SAM2 基线</h2><p>固定概念词组由 Grounding DINO 自动定位，再由 SAM2.1 输出原始对象 Mask；零训练、零点击、零人工笔刷，作为“整窗对象分割”对照。</p><a href="method_b_studio.html">进入开放词汇 SAM2</a></section><section class="card"><h2>ECO-Lattice 多先验遮挡补全</h2><p>以可见杆件证据与遮挡准入为基础，分别生成 CCC 连续曲率、TGC 拓扑图和可拒绝 SRA 对称辅助候选，再统一门控并分层保存。</p><a href="method_c_studio.html">进入 ECO-Lattice 研究台</a></section></div><p class="note">传统阈值与形态学技术为离线基线，不放入网页；人工真值保持独立，是各技术路线共用的评价标准。</p></main></body></html>
